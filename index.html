!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Rabbit Tracker</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { 
            --primary: #ec4899; 
            --bg: #ffffff;      
            --card: #ffffff; 
            --text: #000000;    
            --border: #fbcfe8;  
            --column-bg: #fff5f7; 
            /* User Colors */
            --color-aranyo: #3b82f6; 
            --color-ravi: #10b981;   
            --color-suha: #8b5cf6;   
        }
        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); }
        
        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .rabbit-logo-auth { width: 60px; height: 60px; fill: var(--primary); margin-bottom: 20px; }
        #auth-screen input { padding: 10px; border: 2px solid var(--border); border-radius: 6px; outline: none; margin-bottom: 15px;}
        #auth-screen button { padding: 10px 20px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; background: var(--primary); color: white;}
        
        /* Header & Main */
        #main-app { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid var(--text); padding-bottom: 10px; flex-wrap: wrap; gap: 15px;}
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand svg { width: 40px; height: 40px; fill: var(--text); }
        .brand h1 { margin: 0; font-size: 1.8rem; color: var(--text); }
        .view-controls { display: flex; flex-wrap: wrap; gap: 5px; }
        .view-btn { background: white; border: 2px solid var(--text); color: var(--text); padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: 600;}
        .view-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Task Form */
        .task-form { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 30px; border: 2px solid var(--text); display: flex; gap: 10px; flex-wrap: wrap; }
        .task-form input, .task-form select { flex: 1; min-width: 150px; border: 1px solid var(--text); padding: 10px; border-radius: 4px;}
        .task-form button { background: var(--text); color: white; min-width: 120px; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}

        /* View Containers */
        #daily-view, #weekly-view, #monthly-view { display: none; }
        
        /* --- DAILY VIEW --- */
        .date-navigator { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .date-navigator button { background: var(--card); border: 2px solid var(--text); color: var(--text); padding: 5px 15px; font-size: 1.2rem; cursor: pointer; border-radius: 4px;}
        .date-navigator button:hover { background: var(--text); color: white; }
        .date-navigator h2 { margin: 0; font-size: 1.2rem; min-width: 200px; text-align: center; color: var(--primary);}

        /* Desktop User Columns */
        .daily-desktop { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .column { background: var(--column-bg); border-radius: 12px; min-height: 500px; border: 2px solid var(--border); overflow: hidden;}
        .column h3 { margin: 0; padding: 15px; text-align: center; color: white; font-size: 1.2rem; border-bottom: 2px solid var(--text);}
        .col-timestamp { text-align: center; font-size: 0.75rem; color: #999; padding: 4px 15px 8px; background: var(--column-bg); border-bottom: 1px solid var(--border); }
        .col-tasks { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Task Card & Gamified Slider */
        .task-card { background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--text); box-shadow: 3px 3px 0px var(--text); transition: opacity 0.3s ease;}
        .task-card.is-done { opacity: 0.6; box-shadow: 1px 1px 0px var(--text); }
        .task-card.is-done h4 { text-decoration: line-through; color: #6b7280; }
        .task-card h4 { margin: 0 0 15px 0; font-size: 1.1rem; word-break: break-word;}
        
        .slider-wrap { display: flex; align-items: center; gap: 10px; }
        .slider-wrap input[type="range"] { flex: 1; accent-color: var(--text); cursor: pointer; }
        .progress-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; min-width: 45px; text-align: center;}

        /* Mobile Accordions */
        .daily-mobile { display: none; }
        .accordion-card { background: var(--card); border: 2px solid var(--text); border-radius: 8px; margin-bottom: 15px; box-shadow: 3px 3px 0px var(--border);}
        .accordion-card summary { padding: 15px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; font-weight: bold; }
        .accordion-card summary::-webkit-details-marker { display: none; }
        .progress-wrap { flex: 1; margin: 0 15px; }
        .progress-track { width: 100%; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        .progress-bar { height: 100%; transition: width 0.4s ease; }
        .mobile-task-list { padding: 15px; border-top: 2px solid var(--border); display: flex; flex-direction: column; gap: 15px; background: var(--column-bg); }
        
        @media (max-width: 768px) {
            .daily-desktop { display: none !important; }
            .daily-mobile { display: block !important; }
            .view-btn { padding: 6px 10px; font-size: 0.8rem; }
            .brand h1 { font-size: 1.5rem; }
        }

        /* --- WEEKLY VIEW --- */
        .weekly-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
        .day-col { background: var(--card); border: 2px solid var(--text); border-radius: 8px; min-height: 200px; }
        .day-header { background: var(--text); color: white; padding: 10px; text-align: center; font-weight: bold; border-radius: 4px 4px 0 0;}
        .mini-task { padding: 10px; border-bottom: 1px solid var(--border); font-size: 0.85rem; background: white;}
        .mini-task.is-done { opacity: 0.5; }
        .mini-task.is-done strong { text-decoration: line-through; }

        /* --- MONTHLY VIEW --- */
        .monthly-list { background: var(--card); border: 2px solid var(--text); border-radius: 8px; padding: 15px; }
        .monthly-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;}
        .monthly-info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 250px;}
        .monthly-date { font-weight: bold; color: var(--primary); min-width: 90px; }
        
        /* User Specific Colors */
        .bg-Aranyo { background-color: var(--color-aranyo); }
        .bg-Ravi { background-color: var(--color-ravi); }
        .bg-Suha { background-color: var(--color-suha); }
        .border-Aranyo { border-color: var(--color-aranyo); }
        .border-Ravi { border-color: var(--color-ravi); }
        .border-Suha { border-color: var(--color-suha); }
        .text-Aranyo { color: var(--color-aranyo); }
        .text-Ravi { color: var(--color-ravi); }
        .text-Suha { color: var(--color-suha); }
    </style>
</head>
<body>

<div id="auth-screen">
    <svg class="rabbit-logo-auth" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.984 9.043c-.453-.39-.99-.687-1.573-.855-1.15-.333-2.392-.128-3.37.56-1.59 1.12-2.185 3.255-1.39 5.044.205.464.498.887.86 1.25l-2.036 3.053c-.35.525.025 1.246.657 1.246h4.8c1.32 0 2.39-1.07 2.39-2.39 0-.256-.042-.505-.12-.738l.68-1.564c1.12-.515 1.95-1.537 2.185-2.756.284-1.48-.372-3.003-1.632-3.832l-1.45-5.08c-.146-.51-.62-.86-1.152-.86H8.974c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h3.048l.962 3.37z"/>
        <path d="M20 7h-1.2l-1.37-3.425C17.202 3.01 16.64 2.66 16.03 2.66h-1.56c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h.93L16.63 8H20c.552 0 1-.448 1-1s-.448-1-1-1z"/>
    </svg>
    <h2 style="color: white; margin-bottom: 20px;">Rabbit Tracker</h2>
    <input type="password" id="pass-input" placeholder="Enter Passcode">
    <button onclick="authenticate()">Enter Workspace</button>
</div>

<div id="main-app">
    <div class="header">
        <div class="brand">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.984 9.043c-.453-.39-.99-.687-1.573-.855-1.15-.333-2.392-.128-3.37.56-1.59 1.12-2.185 3.255-1.39 5.044.205.464.498.887.86 1.25l-2.036 3.053c-.35.525.025 1.246.657 1.246h4.8c1.32 0 2.39-1.07 2.39-2.39 0-.256-.042-.505-.12-.738l.68-1.564c1.12-.515 1.95-1.537 2.185-2.756.284-1.48-.372-3.003-1.632-3.832l-1.45-5.08c-.146-.51-.62-.86-1.152-.86H8.974c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h3.048l.962 3.37z"/>
                <path d="M20 7h-1.2l-1.37-3.425C17.202 3.01 16.64 2.66 16.03 2.66h-1.56c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h.93L16.63 8H20c.552 0 1-.448 1-1s-.448-1-1-1z"/>
            </svg>
            <div>
                <h1>Rabbit Tracker</h1>
                <p style="margin: 0; font-size: 0.8rem; color: #666;">Private Workspace</p>
            </div>
        </div>
        <div class="view-controls">
            <button class="view-btn active" onclick="changeView('daily')">Daily</button>
            <button class="view-btn" onclick="changeView('weekly')">Weekly</button>
            <button class="view-btn" onclick="changeView('monthly')">Monthly</button>
        </div>
    </div>

    <div class="task-form">
        <input type="text" id="t-title" placeholder="What needs to be done?">
        <select id="t-user">
            <option value="" disabled selected>Select Assignee...</option>
            <option value="Aranyo">Aranyo</option>
            <option value="Ravi">Ravi</option>
            <option value="Suha">Suha</option>
        </select>
        <input type="date" id="t-date">
        <button onclick="addNewTask()">+ Add Task</button>
    </div>

    <!-- DAILY VIEW -->
    <div id="daily-view">
        <div class="date-navigator">
            <button onclick="changeDateOffset(-1)">&#8592;</button>
            <h2 id="daily-date-display">Today</h2>
            <button onclick="changeDateOffset(1)">&#8594;</button>
        </div>

        <!-- Desktop Layout (3 User Columns) -->
        <div class="daily-desktop">
            <div class="column border-Aranyo">
                <h3 class="bg-Aranyo">Aranyo</h3>
                <div class="col-timestamp" id="ts-Aranyo"></div>
                <div class="col-tasks" id="col-Aranyo"></div>
            </div>
            <div class="column border-Ravi">
                <h3 class="bg-Ravi">Ravi</h3>
                <div class="col-timestamp" id="ts-Ravi"></div>
                <div class="col-tasks" id="col-Ravi"></div>
            </div>
            <div class="column border-Suha">
                <h3 class="bg-Suha">Suha</h3>
                <div class="col-timestamp" id="ts-Suha"></div>
                <div class="col-tasks" id="col-Suha"></div>
            </div>
        </div>
        
        <!-- Mobile Layout -->
        <div class="daily-mobile" id="mobile-accordion-container"></div>
    </div>

    <!-- WEEKLY VIEW -->
    <div id="weekly-view" class="weekly-grid"></div>

    <!-- MONTHLY VIEW -->
    <div id="monthly-view" class="monthly-list">
        <h3 style="margin-top:0;">Remaining Month Tasks</h3>
        <div id="monthly-container"></div>
    </div>
</div>

<script>
    // --- Setup & Config ---
    const firebaseConfig = {
      apiKey: "AIzaSyDVHs6G2J2znexBG2ZZ42Lc3oZePHKR7Qc",
      authDomain: "rabbit-tracker-9c377.firebaseapp.com",
      projectId: "rabbit-tracker-9c377",
      storageBucket: "rabbit-tracker-9c377.firebasestorage.app",
      messagingSenderId: "242709447280",
      appId: "1:242709447280:web:6c5afb369f51a8a2356ab5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let currentView = 'daily';
    let allTasks = [];
    let dateOffset = 0; 
    let viewedDateStr = '';
    let userMeta = {};

    // --- Slider Logic ---
    // The exact Gamified Steps you requested
    const sliderSteps = [0, 10, 20, 40, 80, 100];

    // Helper: Safely get progress (handles legacy tasks that only had "Done" status)
    function getProgress(task) {
        if (task.progress !== undefined) return task.progress;
        return (task.status === 'Done') ? 100 : 0;
    }

    // --- Core Date Logic (3 AM IST Rollover) ---
    function getTrackerDateString() {
        const now = new Date();
        const logicalTime = new Date(now.getTime() - (3 * 60 * 60 * 1000));
        const options = { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' };
        const parts = new Intl.DateTimeFormat('en-CA', options).formatToParts(logicalTime); 
        return `${parts.find(p=>p.type==='year').value}-${parts.find(p=>p.type==='month').value}-${parts.find(p=>p.type==='day').value}`;
    }

    function authenticate() {
        if(document.getElementById('pass-input').value === "ablc") {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            startApp();
        } else {
            alert("Incorrect Passcode.");
        }
    }

    function startApp() {
        document.getElementById('t-date').value = getTrackerDateString();
        updateViewedDate();
        runISTHousekeeping(); 
        syncTasks();
        changeView('daily');
    }

    // --- Day Navigation Logic ---
    function changeDateOffset(change) {
        dateOffset += change;
        updateViewedDate();
        renderDaily();
    }

    function updateViewedDate() {
        const baseDate = new Date(getTrackerDateString());
        baseDate.setDate(baseDate.getDate() + dateOffset);
        viewedDateStr = baseDate.toISOString().split('T')[0];

        let displayText = viewedDateStr;
        if (dateOffset === 0) displayText = `Today (${viewedDateStr})`;
        else if (dateOffset === -1) displayText = `Yesterday (${viewedDateStr})`;
        else if (dateOffset === 1) displayText = `Tomorrow (${viewedDateStr})`;

        document.getElementById('daily-date-display').innerText = displayText;
    }

    // --- Housekeeping: Auto Move at 3 AM ---
    async function runISTHousekeeping() {
        const trackerDate = getTrackerDateString();
        const snapshot = await db.collection("tasks").get();
        const batch = db.batch();

        snapshot.forEach(doc => {
            const data = doc.data();
            // Automatically move if the task date is older than today and progress < 100
            if (data.date < trackerDate && getProgress(data) < 100) {
                batch.update(doc.ref, { date: trackerDate });
            }
        });
        await batch.commit();
    }

    function syncTasks() {
        db.collection("tasks").orderBy("date", "asc").onSnapshot(snapshot => {
            allTasks = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
            renderCurrentView();
        });
        db.collection("userMeta").onSnapshot(snapshot => {
            snapshot.docs.forEach(doc => { userMeta[doc.id] = doc.data(); });
            renderCurrentView();
        });
    }

    async function addNewTask() {
        const title = document.getElementById('t-title').value.trim();
        const user = document.getElementById('t-user').value;
        const date = document.getElementById('t-date').value;
        if(!title || !user || !date) return alert("Please fill title, select assignee, and pick a date.");

        await db.collection("tasks").add({
            title, assignee: user, date, progress: 0, createdAt: Date.now()
        });
        document.getElementById('t-title').value = '';
    }

    // Called when any slider is moved
    async function updateTaskProgress(id, indexValue) {
        const actualProgress = sliderSteps[indexValue];
        const now = new Date();
        const istOptions = { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
        const istStamp = now.toLocaleString('en-GB', istOptions).replace(',', '');
        const task = allTasks.find(t => t.id === id);
        if (task) {
            await db.collection("userMeta").doc(task.assignee).set({ lastUpdated: istStamp }, { merge: true });
        }
        await db.collection("tasks").doc(id).update({ progress: actualProgress });
    }

    function changeView(v) {
        currentView = v;
        document.querySelectorAll('.view-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.toLowerCase().includes(v)));
        
        document.getElementById('daily-view').style.display = (v === 'daily') ? 'block' : 'none';
        document.getElementById('weekly-view').style.display = (v === 'weekly') ? 'grid' : 'none';
        document.getElementById('monthly-view').style.display = (v === 'monthly') ? 'block' : 'none';
        
        renderCurrentView();
    }

    function renderCurrentView() {
        if(currentView === 'daily') renderDaily();
        else if(currentView === 'weekly') renderWeekly();
        else if(currentView === 'monthly') renderMonthly();
    }

    // --- Template Generator for a Task Card ---
    function generateTaskCardHTML(t) {
        const progress = getProgress(t);
        let sliderIdx = sliderSteps.indexOf(progress);
        if(sliderIdx === -1) sliderIdx = progress >= 100 ? 5 : 0; // fallback
        const isDone = progress === 100;

        return `
        <div class="task-card ${isDone ? 'is-done' : ''}">
            <h4>${t.title}</h4>
            <div class="slider-wrap">
                <input type="range" min="0" max="5" step="1" value="${sliderIdx}" 
                       onchange="updateTaskProgress('${t.id}', this.value)"
                       oninput="this.nextElementSibling.innerText = [0,10,20,40,80,100][this.value] + '%'">
                <span class="progress-badge bg-${t.assignee}" style="${isDone ? 'background:#6b7280;' : ''}">${progress}%</span>
            </div>
        </div>`;
    }

    // --- 1. DAILY RENDER ---
    function renderDaily() {
        const dayTasks = allTasks.filter(t => t.date === viewedDateStr);
        const users = ['Aranyo', 'Ravi', 'Suha'];

        // Desktop
        users.forEach(user => {
            const userTasks = dayTasks.filter(t => t.assignee === user);
            const html = userTasks.map(t => generateTaskCardHTML(t)).join('');
            document.getElementById(`col-${user}`).innerHTML = html || '<p style="color:#a1a1aa; text-align:center;">No tasks</p>';
            const ts = userMeta[user]?.lastUpdated;
            document.getElementById(`ts-${user}`).innerText = ts ? `Last updated: ${ts}` : '';
        });

        // Mobile Accordions
        let mobileHtml = '';
        users.forEach(user => {
            const userTasks = dayTasks.filter(t => t.assignee === user);
            const total = userTasks.length;
            
            // Calculate Average Progress for the overall bar
            const sumProgress = userTasks.reduce((sum, t) => sum + getProgress(t), 0);
            const avgProgress = total > 0 ? Math.round(sumProgress / total) : 0;
            
            const tasksHtml = userTasks.map(t => generateTaskCardHTML(t)).join('');
            const lastUp = userMeta[user]?.lastUpdated || '';

            mobileHtml += `
                <details class="accordion-card">
                    <summary>
                        <span class="text-${user}" style="font-size:1.2rem;">${user}${lastUp ? `<span style="display:block; font-size:0.7rem; color:#999; font-weight:normal;">Updated: ${lastUp}</span>` : ''}</span>
                        <div class="progress-wrap">
                            <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:2px;">
                                <span>Avg. Progress</span>
                                <strong>${avgProgress}%</strong>
                            </div>
                            <div class="progress-track">
                                <div class="progress-bar bg-${user}" style="width: ${avgProgress}%"></div>
                            </div>
                        </div>
                        <span style="font-size:1.5rem; color:var(--text);">▾</span>
                    </summary>
                    <div class="mobile-task-list">
                        ${total > 0 ? tasksHtml : '<p style="color:#a1a1aa; text-align:center;">No tasks</p>'}
                    </div>
                </details>`;
        });
        document.getElementById('mobile-accordion-container').innerHTML = mobileHtml;
    }

    // --- 2. WEEKLY RENDER ---
    function renderWeekly() {
        const grid = document.getElementById('weekly-view');
        grid.innerHTML = '';
        
        const currDate = new Date();
        const day = currDate.getDay() || 7; 
        currDate.setHours(0,0,0,0);
        const startOfWeek = new Date(currDate);
        startOfWeek.setDate(currDate.getDate() - day + 1);
        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        for(let i=0; i<7; i++) {
            const targetDate = new Date(startOfWeek);
            targetDate.setDate(startOfWeek.getDate() + i);
            const dateStr = targetDate.toISOString().split('T')[0]; 
            const displayDate = targetDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

            const dayTasks = allTasks.filter(t => t.date === dateStr);
            let tasksHtml = dayTasks.map(t => {
                const progress = getProgress(t);
                let sliderIdx = sliderSteps.indexOf(progress) !== -1 ? sliderSteps.indexOf(progress) : (progress >= 100 ? 5 : 0);
                const isDone = progress === 100;
                
                return `
                <div class="mini-task ${isDone ? 'is-done' : ''}">
                    <strong class="text-${t.assignee}">${t.assignee[0]}:</strong> ${t.title}
                    <div style="display:flex; align-items:center; gap:5px; margin-top:8px;">
                        <input type="range" min="0" max="5" step="1" value="${sliderIdx}" style="width:100%; height:4px; accent-color:var(--text);"
                               onchange="updateTaskProgress('${t.id}', this.value)"
                               oninput="this.nextElementSibling.innerText = [0,10,20,40,80,100][this.value] + '%'">
                        <span style="font-size:0.7rem; font-weight:bold; min-width:30px;">${progress}%</span>
                    </div>
                </div>`;
            }).join('');

            grid.innerHTML += `
                <div class="day-col">
                    <div class="day-header">${daysOfWeek[i]}<br><span style="font-size:0.8rem; font-weight:normal;">${displayDate}</span></div>
                    ${dayTasks.length > 0 ? tasksHtml : '<p style="text-align:center; color:#a1a1aa; font-size:0.8rem; margin-top:20px;">No tasks</p>'}
                </div>`;
        }
    }

    // --- 3. MONTHLY RENDER ---
    function renderMonthly() {
        const container = document.getElementById('monthly-container');
        const trackerDate = getTrackerDateString();
        const currentMonth = trackerDate.substring(0, 7); 
        
        const monthTasks = allTasks.filter(t => t.date.startsWith(currentMonth));
        if(monthTasks.length === 0) {
            container.innerHTML = '<p style="color:#a1a1aa;">No tasks for this month.</p>';
            return;
        }

        let html = '';
        monthTasks.forEach(t => {
            const progress = getProgress(t);
            let sliderIdx = sliderSteps.indexOf(progress) !== -1 ? sliderSteps.indexOf(progress) : (progress >= 100 ? 5 : 0);
            const isDone = progress === 100;

            html += `
            <div class="monthly-item" style="${isDone ? 'opacity:0.5;' : ''}">
                <div class="monthly-info">
                    <div class="monthly-date">${t.date.split('-').reverse().join('-')}</div>
                    <span class="progress-badge bg-${t.assignee}">${t.assignee}</span>
                    <div style="${isDone ? 'text-decoration: line-through;' : ''}">${t.title}</div>
                </div>
                <div style="display:flex; align-items:center; gap:10px; min-width: 150px;">
                    <input type="range" min="0" max="5" step="1" value="${sliderIdx}" style="width:100%; accent-color:var(--text);"
                           onchange="updateTaskProgress('${t.id}', this.value)"
                           oninput="this.nextElementSibling.innerText = [0,10,20,40,80,100][this.value] + '%'">
                    <span style="font-weight:bold; font-size:0.9rem; min-width: 40px;">${progress}%</span>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }
</script>
</body>
</html>
