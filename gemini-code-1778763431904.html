<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Rabbit Tracker</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { 
            --primary: #ec4899; /* Pink */
            --bg: #ffffff;      
            --card: #ffffff; 
            --text: #000000;    
            --border: #fbcfe8;  
            --column-bg: #fff5f7; 
            /* User Colors */
            --color-aranyo: #3b82f6; /* Blue */
            --color-ravi: #10b981;   /* Green */
            --color-suha: #8b5cf6;   /* Purple */
        }
        * { box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); }
        
        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: #000000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .rabbit-logo-auth { width: 60px; height: 60px; fill: var(--primary); margin-bottom: 20px; }
        input, select { padding: 10px; border: 2px solid var(--border); border-radius: 6px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        button { padding: 10px 20px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; transition: all 0.2s; }
        button:hover { opacity: 0.9; }
        
        /* Header & Main */
        #main-app { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid var(--text); padding-bottom: 10px; flex-wrap: wrap; gap: 15px;}
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand svg { width: 40px; height: 40px; fill: var(--text); }
        .brand h1 { margin: 0; font-size: 1.8rem; color: var(--text); }
        .view-btn { background: white; border: 2px solid var(--text); color: var(--text); margin-left: 5px; }
        .view-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Task Form */
        .task-form { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 30px; border: 2px solid var(--text); display: flex; gap: 10px; flex-wrap: wrap; }
        .task-form input, .task-form select { flex: 1; min-width: 150px; border-color: var(--text); }
        .task-form button { background: var(--text); color: white; }

        /* View Containers */
        #daily-view, #weekly-view, #monthly-view { display: none; }
        
        /* 1. DAILY VIEW (Kanban) */
        .daily-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .column { background: var(--column-bg); padding: 15px; border-radius: 12px; min-height: 500px; border: 2px solid var(--border); }
        .column h3 { margin-top: 0; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .task-card { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--text); box-shadow: 4px 4px 0px var(--text); position: relative;}
        .task-card h4 { margin: 0 0 10px 0; font-size: 1.1rem; }
        .assignee-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; color: white; font-weight: bold; margin-bottom: 10px;}
        .daily-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-toggle { flex: 1; background: #f1f5f9; border: 1px solid var(--text); color: var(--text); padding: 6px; font-size: 0.85rem; }
        .btn-toggle.done { background: var(--text); color: white; }

        /* 2. WEEKLY VIEW (Calendar Grid) */
        .weekly-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; overflow-x: auto; }
        .day-col { background: var(--card); border: 2px solid var(--text); border-radius: 8px; min-height: 400px; min-width: 150px;}
        .day-header { background: var(--text); color: white; padding: 10px; text-align: center; font-weight: bold; border-bottom: 2px solid var(--text); border-radius: 4px 4px 0 0;}
        .mini-task { padding: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; font-size: 0.85rem; }
        .mini-task input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; margin: 0; flex-shrink: 0;}
        .mini-task .title { flex: 1; word-break: break-word;}
        .mini-task.is-done { opacity: 0.5; text-decoration: line-through; }
        .color-bar { width: 4px; border-radius: 2px; align-self: stretch; }

        /* 3. MONTHLY VIEW (List) */
        .monthly-list { background: var(--card); border: 2px solid var(--text); border-radius: 8px; padding: 15px; }
        .monthly-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); }
        .monthly-item:last-child { border-bottom: none; }
        .monthly-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .monthly-date { font-weight: bold; color: var(--primary); min-width: 100px; }
        .monthly-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--text); cursor: pointer; }
        
        /* User Specific Colors */
        .bg-Aranyo { background-color: var(--color-aranyo); }
        .bg-Ravi { background-color: var(--color-ravi); }
        .bg-Suha { background-color: var(--color-suha); }
    </style>
</head>
<body>

<div id="auth-screen">
    <svg class="rabbit-logo-auth" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12.984 9.043c-.453-.39-.99-.687-1.573-.855-1.15-.333-2.392-.128-3.37.56-1.59 1.12-2.185 3.255-1.39 5.044.205.464.498.887.86 1.25l-2.036 3.053c-.35.525.025 1.246.657 1.246h4.8c1.32 0 2.39-1.07 2.39-2.39 0-.256-.042-.505-.12-.738l.68-1.564c1.12-.515 1.95-1.537 2.185-2.756.284-1.48-.372-3.003-1.632-3.832l-1.45-5.08c-.146-.51-.62-.86-1.152-.86H8.974c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h3.048l.962 3.37z"/>
        <path d="M20 7h-1.2l-1.37-3.425C17.202 3.01 16.64 2.66 16.03 2.66h-1.56c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h.93L16.63 8H20c.552 0 1-.448 1-1s-.448-1-1-1z"/>
    </svg>
    <h2 style="color: white; margin-bottom: 20px;">Rabbit Tracker</h2>
    <input type="password" id="pass-input" placeholder="Enter Passcode">
    <button onclick="authenticate()" style="background: var(--primary); color: white; margin-top: 15px;">Enter Workspace</button>
</div>

<div id="main-app">
    <div class="header">
        <div class="brand">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.984 9.043c-.453-.39-.99-.687-1.573-.855-1.15-.333-2.392-.128-3.37.56-1.59 1.12-2.185 3.255-1.39 5.044.205.464.498.887.86 1.25l-2.036 3.053c-.35.525.025 1.246.657 1.246h4.8c1.32 0 2.39-1.07 2.39-2.39 0-.256-.042-.505-.12-.738l.68-1.564c1.12-.515 1.95-1.537 2.185-2.756.284-1.48-.372-3.003-1.632-3.832l-1.45-5.08c-.146-.51-.62-.86-1.152-.86H8.974c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h3.048l.962 3.37z"/>
                <path d="M20 7h-1.2l-1.37-3.425C17.202 3.01 16.64 2.66 16.03 2.66h-1.56c-.663 0-1.2.537-1.2 1.2v.002c0 .663.537 1.2 1.2 1.2h.93L16.63 8H20c.552 0 1-.448 1-1s-.448-1-1-1z"/>
            </svg>
            <div>
                <h1>Rabbit Tracker</h1>
                <p id="date-label" style="margin: 0; font-size: 0.9rem; font-weight: bold; color: var(--primary);"></p>
            </div>
        </div>
        <div>
            <button class="view-btn active" onclick="changeView('daily')">Daily View</button>
            <button class="view-btn" onclick="changeView('weekly')">Weekly Grid</button>
            <button class="view-btn" onclick="changeView('monthly')">Monthly Overview</button>
        </div>
    </div>

    <div class="task-form">
        <input type="text" id="t-title" placeholder="What needs to be done?">
        <select id="t-user">
            <option value="" disabled selected>Select Assignee...</option>
            <option value="Aranyo">Aranyo</option>
            <option value="Ravi">Ravi</option>
            <option value="Suha">Suha</option>
        </select>
        <input type="date" id="t-date">
        <button onclick="addNewTask()">+ Add Task</button>
    </div>

    <!-- DAILY VIEW -->
    <div id="daily-view" class="daily-board">
        <div class="column"><h3>Doing Today</h3><div id="daily-doing"></div></div>
        <div class="column">
            <h3 style="border-bottom-color: var(--text);">Auto-Moved (Overdue)</h3>
            <p style="font-size:0.75rem; color:#666; margin-top:-5px;">Missed 00:00 IST deadlines</p>
            <div id="daily-moved"></div>
        </div>
        <div class="column"><h3 style="border-bottom-color: #d1d5db;">Done</h3><div id="daily-done"></div></div>
    </div>

    <!-- WEEKLY VIEW -->
    <div id="weekly-view" class="weekly-grid">
        <!-- Generated by JS -->
    </div>

    <!-- MONTHLY VIEW -->
    <div id="monthly-view" class="monthly-list">
        <h3 style="margin-top:0;">Remaining Month Tasks</h3>
        <div id="monthly-container"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDVHs6G2J2znexBG2ZZ42Lc3oZePHKR7Qc",
      authDomain: "rabbit-tracker-9c377.firebaseapp.com",
      projectId: "rabbit-tracker-9c377",
      storageBucket: "rabbit-tracker-9c377.firebasestorage.app",
      messagingSenderId: "242709447280",
      appId: "1:242709447280:web:6c5afb369f51a8a2356ab5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let currentView = 'daily';
    let allTasks = [];

    // Utility: Get strictly IST Date string (YYYY-MM-DD)
    function getISTDateString() {
        const options = { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' };
        const parts = new Intl.DateTimeFormat('en-CA', options).formatToParts(new Date()); 
        // en-CA formats to YYYY-MM-DD cleanly
        const y = parts.find(p => p.type === 'year').value;
        const m = parts.find(p => p.type === 'month').value;
        const d = parts.find(p => p.type === 'day').value;
        return `${y}-${m}-${d}`;
    }

    function authenticate() {
        if(document.getElementById('pass-input').value === "#1samawritten") {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            startApp();
        } else {
            alert("Incorrect Passcode.");
        }
    }

    function startApp() {
        const todayIST = getISTDateString();
        document.getElementById('t-date').value = todayIST;
        document.getElementById('date-label').innerText = `Current IST Date: ${todayIST}`;
        
        runISTHousekeeping(); 
        syncTasks();
        changeView('daily'); // Initialize views
    }

    async function runISTHousekeeping() {
        const todayIST = getISTDateString();
        const snapshot = await db.collection("tasks").get();
        const batch = db.batch();

        snapshot.forEach(doc => {
            const data = doc.data();
            // Automatically move if date is past today in IST and not already Done
            if (data.date < todayIST && data.status !== 'Done') {
                batch.update(doc.ref, { date: todayIST, status: 'Moved' });
            }
        });
        await batch.commit();
    }

    function syncTasks() {
        db.collection("tasks").orderBy("date", "asc").onSnapshot(snapshot => {
            allTasks = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
            renderCurrentView();
        });
    }

    async function addNewTask() {
        const title = document.getElementById('t-title').value.trim();
        const user = document.getElementById('t-user').value;
        const date = document.getElementById('t-date').value;
        if(!title || !user || !date) return alert("Please fill title, select assignee, and pick a date.");

        await db.collection("tasks").add({
            title, assignee: user, date, status: 'Doing', createdAt: Date.now()
        });
        document.getElementById('t-title').value = '';
    }

    // Toggle between Doing and Done (Removes "Moved" once clicked)
    async function toggleTaskStatus(id, currentStatus) {
        const newStatus = (currentStatus === 'Done') ? 'Doing' : 'Done';
        await db.collection("tasks").doc(id).update({ status: newStatus });
    }

    function changeView(v) {
        currentView = v;
        document.querySelectorAll('.view-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.toLowerCase().includes(v)));
        
        document.getElementById('daily-view').style.display = (v === 'daily') ? 'grid' : 'none';
        document.getElementById('weekly-view').style.display = (v === 'weekly') ? 'grid' : 'none';
        document.getElementById('monthly-view').style.display = (v === 'monthly') ? 'block' : 'none';
        
        renderCurrentView();
    }

    function renderCurrentView() {
        if(currentView === 'daily') renderDaily();
        else if(currentView === 'weekly') renderWeekly();
        else if(currentView === 'monthly') renderMonthly();
    }

    // --- 1. DAILY RENDER ---
    function renderDaily() {
        const todayIST = getISTDateString();
        const lists = { Doing: '', Moved: '', Done: '' };
        
        allTasks.forEach(t => {
            if(t.date !== todayIST) return; // Only show today's tasks in daily view
            
            const btnText = t.status === 'Done' ? 'Undo (Mark Doing)' : 'Mark as Done';
            const btnClass = t.status === 'Done' ? 'btn-toggle done' : 'btn-toggle';
            
            const html = `
                <div class="task-card">
                    <span class="assignee-badge bg-${t.assignee}">${t.assignee}</span>
                    <h4>${t.title}</h4>
                    <div class="daily-actions">
                        <button class="${btnClass}" onclick="toggleTaskStatus('${t.id}', '${t.status}')">
                            ${t.status === 'Done' ? '✔ Done' : 'Complete Task'}
                        </button>
                    </div>
                </div>`;
            lists[t.status] += html;
        });

        document.getElementById('daily-doing').innerHTML = lists.Doing || '<p style="color:#a1a1aa;">Empty</p>';
        document.getElementById('daily-moved').innerHTML = lists.Moved || '<p style="color:#a1a1aa;">Empty</p>';
        document.getElementById('daily-done').innerHTML = lists.Done || '<p style="color:#a1a1aa;">Empty</p>';
    }

    // --- 2. WEEKLY RENDER ---
    function renderWeekly() {
        const grid = document.getElementById('weekly-view');
        grid.innerHTML = '';
        
        // Calculate week (Monday to Sunday) based on IST today
        const currDate = new Date();
        const day = currDate.getDay() || 7; // Make Sunday = 7
        currDate.setHours(0,0,0,0);
        const startOfWeek = new Date(currDate);
        startOfWeek.setDate(currDate.getDate() - day + 1);

        const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

        for(let i=0; i<7; i++) {
            const targetDate = new Date(startOfWeek);
            targetDate.setDate(startOfWeek.getDate() + i);
            const dateStr = targetDate.toISOString().split('T')[0]; // Format YYYY-MM-DD
            const displayDate = targetDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

            // Filter tasks for this day
            const dayTasks = allTasks.filter(t => t.date === dateStr);
            
            let tasksHtml = dayTasks.map(t => {
                const isChecked = t.status === 'Done' ? 'checked' : '';
                return `
                <div class="mini-task ${t.status === 'Done' ? 'is-done' : ''}">
                    <div class="color-bar bg-${t.assignee}"></div>
                    <input type="checkbox" onchange="toggleTaskStatus('${t.id}', '${t.status}')" ${isChecked}>
                    <div class="title"><strong>${t.assignee[0]}:</strong> ${t.title}</div>
                </div>`;
            }).join('');

            if(dayTasks.length === 0) tasksHtml = '<p style="text-align:center; color:#a1a1aa; font-size:0.8rem; margin-top:20px;">No tasks</p>';

            grid.innerHTML += `
                <div class="day-col">
                    <div class="day-header">${daysOfWeek[i]}<br><span style="font-size:0.8rem; font-weight:normal;">${displayDate}</span></div>
                    ${tasksHtml}
                </div>`;
        }
    }

    // --- 3. MONTHLY RENDER ---
    function renderMonthly() {
        const container = document.getElementById('monthly-container');
        const todayIST = getISTDateString();
        const currentMonth = todayIST.substring(0, 7); // "YYYY-MM"
        
        // Get all tasks for this month (both pending and done to show overview)
        const monthTasks = allTasks.filter(t => t.date.startsWith(currentMonth));
        
        if(monthTasks.length === 0) {
            container.innerHTML = '<p style="color:#a1a1aa;">No tasks for this month.</p>';
            return;
        }

        let html = '';
        monthTasks.forEach(t => {
            const isChecked = t.status === 'Done' ? 'checked' : '';
            const textStyle = t.status === 'Done' ? 'text-decoration: line-through; color: #a1a1aa;' : '';
            
            html += `
            <div class="monthly-item">
                <div class="monthly-info">
                    <div class="monthly-date">${t.date.split('-').reverse().join('-')}</div>
                    <span class="assignee-badge bg-${t.assignee}" style="margin:0;">${t.assignee}</span>
                    <div style="${textStyle}">${t.title}</div>
                </div>
                <input type="checkbox" onchange="toggleTaskStatus('${t.id}', '${t.status}')" ${isChecked}>
            </div>`;
        });
        
        container.innerHTML = html;
    }
</script>
</body>
</html>
